# サイト基本設定
title: satoryu.com
name: 佐藤 竜也
tagline: AIと一緒につくる時代の、ソフトウェア開発の相談役
description: 佐藤竜也（satoryu）の個人サイト。15年以上のWebアプリケーション開発とOSSメンテナの経験をもとに、AI時代のソフトウェア開発の相談・コードレビュー・開発支援を個人事業として提供しています。
email: satoryu.1981@gmail.com
url: "https://www.satoryu.com"
baseurl: ""
lang: ja
timezone: Asia/Tokyo
repository: satoryu/satoryu.github.io

logo: /assets/img/logo.png
og_image: /assets/img/ogp.png

# Google Analytics 4（本番ビルド JEKYLL_ENV=production のときのみ読み込む）
google_analytics: G-P6RYL7T817

author:
  name: 佐藤 竜也
  handle: satoryu
  avatar: /assets/img/profile.jpeg
  bio: プログラマー。Ruby / Ruby on Rails での Web 開発を 15 年以上。Ruby の docx gem メンテナ。AI エージェントと一緒に開発する日々の実践を、個人事業として支援に活かしています。
  location: 東京
  email: satoryu.1981@gmail.com

# 問い合わせ手段
contact:
  form_url: https://forms.office.com/r/JW9f3KfmRd
  form_embed_url: https://forms.office.com/r/JW9f3KfmRd?embed=true
  email: satoryu.1981@gmail.com
  x: https://twitter.com/satoryuofficial
  messenger: https://www.messenger.com/t/satoryu
  response_time: 1営業日以内

# note（外部ブログ）。RSS を scripts/fetch_note_posts.rb で取得し _data/note_posts.json に保存する
note:
  username: satoryu
  url: https://note.com/satoryu
  # トップページに載せたくない記事の URL をここに列挙する
  exclude: []

social:
  - label: GitHub
    key: github
    url: https://github.com/satoryu
  - label: X
    key: x
    url: https://twitter.com/satoryuofficial
  - label: LinkedIn
    key: linkedin
    url: https://www.linkedin.com/in/satoryu/
  - label: Facebook
    key: facebook
    url: https://www.facebook.com/satoryu
  - label: Speaker Deck
    key: speakerdeck
    url: https://speakerdeck.com/satoryu
  - label: note
    key: note
    url: https://note.com/satoryu

twitter:
  username: satoryuofficial

# ビルド設定
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  hard_wrap: false

sass:
  sass_dir: _sass
  style: compressed

# 記事の URL 構造（従来どおり /:categories/YYYY/MM/DD/title.html）
permalink: /:categories/:year/:month/:day/:title:output_ext

plugins:
  - jekyll-feed
  - jekyll-gfm-admonitions
  - jekyll-linkpreview
  - jekyll-sitemap
  - jekyll/tagging
  - jekyll-tagging-related_posts
  - jemoji

include:
  - _pages

exclude:
  - api/
  - node_modules/
  - Gemfile*
  - package*.json
  - CLAUDE.md
  - README.md
  - docs/
  - scripts/
  - .claude/
  - .ruby-lsp/
  - .textlintrc

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      ga_group: blog
  - scope:
      path: ""
      type: pages
    values:
      layout: page
      ga_group: page
