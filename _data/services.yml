# 提供サービス。id は /business/ ページ内の見出しアンカーと一致させる。
- id: tech-consulting
  title: スポット技術相談・設計レビュー
  summary: Rails などの技術選定、システム設計、Azure の構成について、選択肢とトレードオフを整理します。壁打ちと簡単なメモまでをスポットでお受けします。
  price: 5,000円〜 / 時間
  price_note: 初回30分は無料
  for: 技術の判断を相談する相手がほしいチーム、ひとりで開発している方
- id: development-direction
  title: 開発方針・技術的意思決定の支援
  summary: 要求と制約を整理し、MVP や初回リリースの範囲、優先順位、リスク、次の行動を一緒に決めていきます。
  price: 5,000円〜 / 時間
  price_note: 継続する場合は月額サポート（50,000円〜 / 月）
  for: 何から作るべきか決めかねているチーム、非エンジニアの方
- id: ai-workflow
  title: AI活用・開発ワークフロー支援
  summary: Claude Code などの活用方針、品質と保守性の保ち方、導入の試し方を一緒に検証します。個人での実践で得た、うまくいった点もつまずいた点も共有します。
  price: 70,000円 / 月
  price_note: 提供実績づくりのためのモニター価格
  for: AIを開発に取り入れたいチーム、AIでツールを作っている方
- id: spot-development
  title: スポット開発・技術検証
  summary: Ruby / Rails、Web API、Azure、WebExtensions を使った限定的な改修や PoC を、実装範囲・納期・検収範囲を事前に合意して進めます。
  price: 個別見積り
  price_note: 継続開発は100,000円〜 / 月
  for: 小さく作って確かめたいチーム、新規サービスの立ち上げ
