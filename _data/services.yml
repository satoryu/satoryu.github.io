# 提供サービス。id は /business/ ページ内の見出しアンカーと一致させる。
- id: ai-consulting
  title: AI活用開発の相談・壁打ち
  summary: 「AIでツールを作ったが、このまま使い続けていいのか」「本番公開の前に見てほしい」といった相談を、スポットでお受けします。専門用語を使わない説明を心がけます。
  price: 5,000円〜 / 時間
  price_note: 初回30分は無料
  for: 非エンジニアの方、ひとりで開発している方
- id: ai-code-review
  title: AIが書いたコードのレビュー・品質支援
  summary: AIが生成したコードを、セキュリティ・保守性・テストの観点から継続的にレビューします。OSSメンテナとして培ったレビューの目で、公開して問題ないかを判断します。
  price: 50,000円〜 / 月
  price_note: 非同期のレビューと月1回のミーティング
  for: 少人数の開発チーム、レビュアーが不足しているチーム
- id: ai-adoption
  title: AIエージェント開発の導入・活用の伴走
  summary: Claude Code などのAIエージェントを開発に取り入れたいチームを支援します。自身の実践で得た、うまくいった点もつまずいた点も共有しながら、一緒に検証して進めます。
  price: 70,000円 / 月
  price_note: 提供実績づくりのためのモニター価格
  for: AIエージェント開発をこれから始めるチーム
- id: web-development
  title: Webサービス・Chrome拡張の開発支援
  summary: Ruby / Ruby on Rails を中心としたWebアプリケーション開発と、WebExtensions によるブラウザ拡張の開発を、実装まで含めて支援します。
  price: 100,000円〜 / 月
  price_note: Chrome拡張は個別見積り
  for: 実装まで任せたいチーム、新規サービスの立ち上げ
