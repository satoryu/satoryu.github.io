hero:
  eyebrow: ソフトウェア開発の技術相談と実装支援
  title_lines:
    - 技術的な判断から実装まで。
    - 必要なところを、一緒に。
  lead: >-
    技術選定、システム設計、開発の進め方、AI活用。
    15年以上のWeb開発・受託開発・OSSメンテナンスの経験をもとに、技術的な相談から小規模な設計・実装・検証まで支援します。
    相談だけでも、動くものを作るところまででも、必要な範囲からご相談ください。
  primary:
    label: 初回30分無料で相談する
    url: /contact/
  secondary:
    label: サービスの詳細を見る
    url: /business/
  notes:
    - 1営業日以内に返信
    - 非エンジニアの方も歓迎
    - 原則フルリモート・非同期中心

trust:
  - value: 15年+
    label: Ruby / Rails でのWeb開発
  - value: OSS
    label: Ruby の docx gem メンテナ
  - value: 登壇
    label: RSGT・Scrum Fest・XP祭り
  - value: 2位
    label: Developers Summit 2018 ベストスピーカー賞

pains:
  heading: こんなときに、声をかけてください
  items:
    - title: 技術選定や設計の判断を相談したい
      text: フルタイムの採用は重い。必要なときだけ、経験のあるエンジニアと選択肢やトレードオフを整理したい。
      service: tech-consulting
    - title: 要件・納期・優先順位を踏まえて開発方針を整理したい
      text: やりたいことはあるけれど、最初に何を作り、何を後回しにするかを決めきれていない。
      service: development-direction
    - title: Claude Code などのAIを開発に導入・活用したい
      text: 何から始めればよいか見えていない。AIで作ったものを、このまま使い続けてよいかも確認したい。
      service: ai-workflow
    - title: プロトタイプ、Web API、ブラウザ拡張などを小さく作って検証したい
      text: 大きな開発を始める前に、動くものを作って実現性を確かめたい。
      service: spot-development

reasons:
  heading: 選ばれる理由
  items:
    - title: コードを「書く」だけでなく「判断してきた」経験
      text: >-
        Ruby / Rails でのWeb開発を15年以上続けながら、Ruby の docx gem のメンテナとして、世界中の開発者から寄せられるコードをレビューし、リリースの可否を判断しています。
      link:
        label: 1日で4回リリースした日の記事
        url: /blog/2026/06/04/docx-gem-headers-footers-and-more.html
    - title: 設計から実装まで、自分の手で確かめられる
      text: >-
        Webアプリケーション、Web API、Azure 上の環境構築、ブラウザ拡張を実際に開発してきました。
        受託開発での設計や進行の経験も、相談だけで終わらない支援に活かします。
      link:
        label: ポートフォリオを見る
        url: /portfolio/
    - title: AIエージェント開発の実践者
      text: >-
        個人開発のほとんどを Claude Code で行い、要件定義から設計レビュー、実装までをAIに任せる開発スタイルを実践しています。
        チームへの導入支援の提供実績はこれからの分野ですが、うまくいったことも、つまずいたことも発信しています。
      link:
        label: 1,000万件のCSVをClaude Codeで分析した事例
        url: /blog/2026/01/17/csv-analysis-with-claude-code.html
    - title: アジャイル開発・チーム改善の知見
      text: >-
        Regional Scrum Gathering Tokyo、スクラムフェス大阪・札幌、XP祭りなど、国内の主要なアジャイル開発カンファレンスで登壇してきました。
        コードだけでなく、チームの進め方についても相談できます。
      link:
        label: 講演資料を見る
        url: /presentations/

steps:
  heading: ご相談から契約までの流れ
  items:
    - title: お問い合わせ
      text: フォームからご連絡ください。「何を頼めるか分からない」という状態でも構いません。1営業日以内に返信します。
    - title: 初回相談（30分・無料）
      text: 平日22時以降または週末に、オンラインで状況をお聞きします。私が力になれるか、どんな関わり方が合うかを率直にお伝えします。
    - title: ご提案・ご契約
      text: スポット相談、月額サポート、開発支援など、状況に合わせた形をご提案します。範囲と成果物を合意した後に、契約書・NDAを取り交わします。

pricing_note: 初回のご相談（30分）は無料。スポット相談は5,000円〜/時間、月額サポートは50,000円/月からです。
