<a class="linkpreview" href="{{ link_url }}" target="_blank" rel="noopener">
  <span class="linkpreview__body">
    <span class="linkpreview__title">{{ link_title }}</span>
    <span class="linkpreview__desc">{{ link_description | strip_html | truncate: 120 }}</span>
    <span class="linkpreview__domain">{{ link_domain | default: link_url }}</span>
  </span>
  {%- if link_image -%}
  <span class="linkpreview__thumb" style="background-image:url('{{ link_image }}')"></span>
  {%- endif -%}
</a>
